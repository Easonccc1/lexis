<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070b14;--card:#121c2f;--card2:#18253d;--line:rgba(255,255,255,.09);

html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Helvetica,Arial,sans-serif;
color:var(--fg);background:var(--bg);

radial-gradient(600px 360px at 110% 12%,rgba(139,92,246,.18),transparent 70%);
background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;
padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
#app{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;
background:linear-gradient(135deg,#3d6ef7,#7b4bff 72%);color:#fff;
box-shadow:0 20px 44px -22px rgba(88,110,255,.95);margin-bottom:12px}
.hero:after{content:'';position:absolute;width:190px;height:190px;border-radius:50%;
background:rgba(255,255,255,.13);right:-60px;top:-80px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.hero-kicker{font-size:12px;font-weight:700;letter-spacing:1px;opacity:.85;text-transform:uppercase}
.hero-num{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:6px}
.hero-num span{font-size:14px;font-weight:600;opacity:.85;letter-spacing:0}
.hero-sub{font-size:12.5px;opacity:.92;margin-top:6px;line-height:1.5}
.ring{--p:0deg;width:76px;height:76px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
background:conic-gradient(#fff var(--p),rgba(255,255,255,.25) 0);position:relative}
.ring>div{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
font-size:13px;font-weight:800;background:linear-gradient(135deg,#3d6ef7,#7b4bff)}
.hero-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.hero-bar>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;color:var(--fg);
font-family:inherit;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.985)}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;
background:rgba(91,140,255,.16);flex:0 0 auto}
.tile-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-t b{font-size:15.5px;font-weight:700}
.tile-t small{font-size:12.5px;color:var(--dim)}
.chev{margin-left:auto;color:var(--dim);font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
.mini{font-size:12.5px;line-height:1.65;color:var(--dim)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.big{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.streak{font-size:14px;font-weight:800;padding:8px 11px;border-radius:12px;
background:var(--card);border:1px solid var(--line);white-space:nowrap}
.row{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--card2);
border:1px solid var(--line);font-size:13px;line-height:1.35;color:var(--fg);font-family:inherit;cursor:pointer}
.chip.sel{background:rgba(91,140,255,.24);border-color:rgba(91,140,255,.65);color:#bcd0ff}
.chip.miss{border-style:dashed;opacity:.7}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--fg);
font-family:inherit;font-size:15px;font-weight:700;padding:13px 16px;border-radius:14px;cursor:pointer;
flex:1;min-width:110px}
.btn.primary{background:linear-gradient(135deg,#5b8cff,#8b5cf6);border:none;color:#fff;
box-shadow:0 12px 26px -14px rgba(91,140,255,.95)}

.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.ghost{background:none;border:none;color:var(--acc);font-family:inherit;font-size:14px;
font-weight:700;padding:8px 4px;cursor:pointer}
.icon{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
font-size:18px;cursor:pointer;flex:0 0 auto;color:var(--fg)}
.progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress>i{display:block;height:100%;border-radius:99px;
background:linear-gradient(90deg,#5b8cff,#8b5cf6);transition:width .3s}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{font-size:12px;font-weight:800;color:var(--dim);padding:6px 11px;border-radius:999px;
background:var(--card);border:1px solid var(--line);white-space:nowrap}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;margin-bottom:12px}
.word{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;word-break:break-word}
.wordmeta{font-size:13px;color:var(--dim);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 8px;
border-radius:7px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.badge.acc{color:var(--acc);border-color:rgba(91,140,255,.4)}
.hint{font-size:12.5px;color:var(--dim);margin:12px 0 0}
.def{font-size:17px;line-height:1.6;margin-top:14px}
.ex{font-size:14.5px;color:var(--dim);font-style:italic;margin-top:10px;line-height:1.6}
.zh{background:var(--card2);border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.7}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
border-radius:16px;padding:14px;margin-bottom:10px;color:var(--fg);font-size:15px;line-height:1.5;
font-family:inherit;cursor:pointer;transition:.15s}
.opt .ltr{flex:0 0 20px;font-weight:800;color:var(--dim);font-size:13px;padding-top:2px}
.opt.ok{border-color:var(--ok);background:rgba(47,214,165,.14)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,129,.14)}
.opt.dim{opacity:.5}
.opt.idk{border-style:dashed;color:var(--dim);font-style:italic}
.opt.idk.bad{border-color:var(--bad);background:rgba(255,107,129,.10);opacity:1}
.memgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.memcell{background:var(--card2);border-radius:12px;padding:10px}
.memcell b{display:block;font-size:16px}
.memcell span{font-size:11px;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:8px;height:74px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#6f9bff,#8b5cf6);min-height:4px}
.bar span{font-size:10px;color:var(--dim)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:10.5px;color:var(--dim)}
.wrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
border-bottom:1px solid var(--line);padding:10px 0;color:var(--fg);font-family:inherit;text-align:left;cursor:pointer}
.wrow:last-child{border-bottom:none}
.wrow b{font-size:15px}
.wrow small{color:var(--dim);font-size:11.5px}
.wbar{flex:1;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#8b5cf6)}
label.f{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin:14px 0 0}
label.f input,label.f select{display:block;width:100%;margin-top:6px;font-size:16px;padding:11px 12px;
border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-family:inherit}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(128,150,200,.25);
border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto}
.lboxes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 12px;min-height:34px}
.lbox{min-width:24px;height:34px;padding:0 6px;border-radius:9px;border:1.5px dashed var(--line);
display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--fg)}
.lbox.fill{border-style:solid;border-color:rgba(91,140,255,.65);background:rgba(91,140,255,.14)}
.lbox.rev{border-style:solid;border-color:var(--ok);background:rgba(47,214,165,.16);color:var(--ok)}
.spellin{width:100%;text-align:center;font-size:20px;letter-spacing:2px;padding:12px;border-radius:12px;
border:1px solid var(--line);background:var(--card2);color:var(--fg);font-family:inherit;outline:none}
.spellin:focus{border-color:var(--acc)}
.errbox{background:rgba(255,107,129,.10);border:1px solid rgba(255,107,129,.35);border-radius:12px;
padding:10px 12px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#ffb8c4}
.linkgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.linkgrid a{text-decoration:none;font-size:12.5px;padding:8px 11px;border-radius:11px;
background:var(--card2);border:1px solid var(--line);color:var(--acc);font-weight:700}
.sense{border-left:2px solid rgba(91,140,255,.5);padding:4px 0 4px 10px;margin-top:10px;
font-size:14px;line-height:1.55}
.sense i{display:block;color:var(--dim);font-style:normal;font-size:10.5px;letter-spacing:.5px;
text-transform:uppercase;margin-bottom:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:30;
background:rgba(10,16,28,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
@media (prefers-color-scheme:light){.tabbar{background:rgba(255,255,255,.95)}}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:18px;display:flex;
flex-direction:column;align-items:center;gap:3px;font-family:inherit;padding:4px 0;cursor:pointer}
.tabbar button span{font-size:10px;font-weight:700}
.tabbar button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
background:rgba(0,0,0,.88);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;
max-width:86vw;opacity:0;pointer-events:none;transition:.25s;z-index:99;text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<div id="app"></div>
<div id="toast"></div>
<nav id="tabs" class="tabbar" style="display:none">
  <button data-act="tab" data-val="home">📚<span>学习</span></button>
  <button data-act="tab" data-val="review">🔁<span>复习</span></button>
  <button data-act="tab" data-val="stats">📈<span>词库</span></button>
  <button data-act="tab" data-val="settings">⚙️<span>设置</span></button>
</nav>
<script>
"use strict";
/* ================= 工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);const t=b[i];b[i]=b[j];b[j]=t;}return b;};
const DAY=86400000;
const todayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const yesterdayStr=()=>todayStr(new Date(Date.now()-DAY));
let toastT;
function toast(m,ms){const el=$('#toast');el.textContent=m;el.classList.add('on');
clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms||2200);}
function stripThink(t){
  let s=String(t||'');
  s=s.replace(/<think(?:ing)?>[\s\S]*?<\/think(?:ing)?>/gi,'');
  s=s.replace(/<\|?(?:thinking|thought)\|?>[\s\S]*?<\|\/?(?:thinking|thought)\|?>/gi,'');
  s=s.replace(/^\s*(?:\*\*)?(?:thinking|thought|reasoning|思考过程|推理过程|分析过程)(?:\*\*)?\s*[:：][\s\S]*?(?:\n\s*\n)/i,'');
  return s.replace(/\n{3,}/g,'\n\n').trim();
}

/* ================= 等级 / 词库 ================= */
const LEVELS=['A1','A2','B1','B2','C1','C2'];
const LEVELDESC={
1:'能理解日常简单表达。建议从高频生活词起步，先把动词和句型用熟。',
2:'能应付简单交流。重点练动词搭配与常用句式。',
3:'能讨论熟悉话题。开始扩展同义替换与抽象名词。',
4:'能较流畅表达观点。学学术与写作高频词，注意语域。',
5:'能处理复杂话题。精练搭配、语域和细微差别。',
6:'阅读接近母语水平。打磨修辞与罕见词，重视语感。'};
const TOPICS=['雅思/托福','学术写作','商务职场','日常口语','科技互联网','新闻阅读','文学阅读','医学健康','法律','旅游'];
const BOX=[0.5,1,2,4,7,15,30,60,120,240];

const BANK=[
{w:'borrow',pos:'verb',ipa:'/ˈbɒrəʊ/',lvl:1,def:'to take something that belongs to someone else and agree to give it back later',ex:'Can I borrow your pen for a minute?',syn:['take on loan','use temporarily'],ant:['lend'],forms:['borrows','borrowing','borrowed'],col:['borrow money from a friend','borrow a book from the library'],note:'borrow 是借入，lend 是借出。',zh:'借；借用'},
{w:'hungry',pos:'adjective',ipa:'/ˈhʌŋɡri/',lvl:1,def:'feeling that you need or want to eat',ex:'I was so hungry that I ate two sandwiches.',syn:['starving','famished'],ant:['full','satisfied'],forms:['hungrier','hungriest','hungrily'],col:['go hungry','hungry for success'],note:'hungry for sth 表示渴望得到某物。',zh:'饥饿的；渴望的'},
{w:'quiet',pos:'adjective',ipa:'/ˈkwaɪət/',lvl:1,def:'making very little or no noise',ex:'Please be quiet while the baby is sleeping.',syn:['silent','hushed'],ant:['noisy','loud'],forms:['quieter','quietest','quietly'],col:['keep quiet','a quiet street'],note:'注意与 quite 只差一个字母。',zh:'安静的'},
{w:'arrive',pos:'verb',ipa:'/əˈraɪv/',lvl:1,def:'to get to a place, especially at the end of a journey',ex:'We arrived in Tokyo just after midnight.',syn:['reach','get to'],ant:['leave','depart'],forms:['arrives','arriving','arrived','arrival'],col:['arrive at the airport','arrive on time'],note:'arrive at 接小地点，arrive in 接城市国家。',zh:'到达'},
{w:'cheap',pos:'adjective',ipa:'/tʃiːp/',lvl:1,def:'costing little money, or less money than you expected',ex:'We found a cheap flight to Rome.',syn:['inexpensive','affordable'],ant:['expensive','costly'],forms:['cheaper','cheapest','cheaply'],col:['cheap and cheerful','dirt cheap'],note:'形容人 cheap 是“小气”，含贬义。',zh:'便宜的'},
{w:'choose',pos:'verb',ipa:'/tʃuːz/',lvl:1,def:'to decide which one of several things you want',ex:'You can choose any three books from the list.',syn:['select','pick'],ant:['reject','refuse'],forms:['chooses','choosing','chose','chosen'],col:['choose between','choose to do sth'],note:'过去式 chose，过去分词 chosen。',zh:'选择'},
{w:'answer',pos:'verb',ipa:'/ˈɑːnsə(r)/',lvl:1,def:'to say or write something as a reply to a question',ex:'She answered every question confidently.',syn:['reply','respond'],ant:['ask'],forms:['answers','answering','answered'],col:['answer a question','answer the phone'],note:'answer 是及物动词，后面不加 to。',zh:'回答'},
{w:'finish',pos:'verb',ipa:'/ˈfɪnɪʃ/',lvl:1,def:'to come to the end of something, or to complete it',ex:'I finished the report at midnight.',syn:['complete','end'],ant:['start','begin'],forms:['finishes','finishing','finished'],col:['finish doing sth','finish off'],note:'finish 后接动名词：finish reading。',zh:'完成；结束'},

{w:'advise',pos:'verb',ipa:'/ədˈvaɪz/',lvl:2,def:'to tell someone what you think they should do in a particular situation',ex:'The doctor advised him to rest for a week.',syn:['recommend','counsel'],ant:['discourage'],forms:['advises','advising','advised','advice'],col:['strongly advise','advise against doing sth'],note:'advise 是动词，advice 是不可数名词。',zh:'建议；劝告'},
{w:'ancient',pos:'adjective',ipa:'/ˈeɪnʃənt/',lvl:2,def:'belonging to a time long ago in history',ex:'We visited the ruins of an ancient temple.',syn:['old','age-old'],ant:['modern','contemporary'],forms:['more ancient','most ancient'],col:['ancient history','ancient civilization'],note:'',zh:'古代的'},
{w:'brave',pos:'adjective',ipa:'/breɪv/',lvl:2,def:'willing to face danger, pain or difficulty without showing fear',ex:'It was brave of her to speak up in the meeting.',syn:['courageous','bold'],ant:['cowardly','timid'],forms:['braver','bravest','bravely'],col:['be brave enough to do sth','a brave decision'],note:'It is brave of sb to do sth 是高频句型。',zh:'勇敢的'},
{w:'complain',pos:'verb',ipa:'/kəmˈpleɪn/',lvl:2,def:'to say that you are annoyed or not satisfied about something',ex:'Several customers complained about the slow service.',syn:['grumble','protest'],ant:['praise','accept'],forms:['complains','complaining','complained','complaint'],col:['complain about sth','complain to sb'],note:'complain about 后接抱怨的事。',zh:'抱怨；投诉'},
{w:'deliver',pos:'verb',ipa:'/dɪˈlɪvə(r)/',lvl:2,def:'to take goods, letters or messages to a place or person',ex:'The parcel was delivered to the wrong address.',syn:['transport','hand over'],ant:['collect','withhold'],forms:['delivers','delivering','delivered','delivery'],col:['deliver a speech','deliver on a promise'],note:'deliver a speech 是发表演讲。',zh:'递送；发表'},
{w:'reduce',pos:'verb',ipa:'/rɪˈdjuːs/',lvl:2,def:'to make something smaller in size, amount or degree',ex:'The company reduced its prices by ten per cent.',syn:['decrease','lessen'],ant:['increase','raise'],forms:['reduces','reducing','reduced','reduction'],col:['reduce costs','reduce the risk of'],note:'reduce by 接幅度，reduce to 接结果。',zh:'减少；降低'},
{w:'polite',pos:'adjective',ipa:'/pəˈlaɪt/',lvl:2,def:'behaving in a way that shows respect for other people',ex:'He was polite but firm in his reply.',syn:['courteous','respectful'],ant:['rude','impolite'],forms:['politer','politest','politely','politeness'],col:['be polite to sb','polite conversation'],note:'',zh:'礼貌的'},

/* ================= 状态 ================= */
const KEY='lexis.v4';
function defaults(){return{v:4,
  settings:{key:'',model:'deepseek-chat',base:'https://api.deepseek.com',proxy:''},
  profile:{level:3,tested:false,needsDone:false,dailyNew:10,days:7,goal:'',topics:[],
    streak:0,last:'',days:[]},
  words:{},mem:{},pack:null,optUse:{},session:null,test:null,
  today:{date:'',newN:0,revN:0,right:0,wrong:0},
  stats:{right:0,wrong:0,spellRight:0,spellWrong:0}};}
let S=(function(){
  try{
    const raw=localStorage.getItem(KEY)||localStorage.getItem('lexis.v3')||localStorage.getItem('lexis.v2');
    if(raw){
      const o=JSON.parse(raw),d=defaults();
      const out=Object.assign(d,o);
      out.settings=Object.assign(defaults().settings,o.settings||{});
      out.profile=Object.assign(defaults().profile,o.profile||{});
      out.today=Object.assign(defaults().today,o.today||{});
      out.stats=Object.assign(defaults().stats,o.stats||{});
      out.words=o.words||{};out.mem=o.mem||{};out.optUse=o.optUse||{};
      if(!Array.isArray(out.profile.topics))out.profile.topics=[];
      if(!out.profile.days)out.profile.days=7;
      return out;
    }
  }catch(e){}
  return defaults();
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('本地存储写入失败');}}
function ensureDay(){
  const t=todayStr();
  if(S.today.date!==t){
    S.today={date:t,newN:0,revN:0,right:0,wrong:0};
    if(S.profile.last&&S.profile.last!==t&&S.profile.last!==yesterdayStr())S.profile.streak=0;
    save();
  }
}
function touchStreak(){
  const t=todayStr();
  if(S.profile.last!==t){
    S.profile.streak=(S.profile.last===yesterdayStr()?(S.profile.streak||0):0)+1;
    S.profile.last=t;save();
  }
}
function newLeft(){ensureDay();return Math.max(0,(S.profile.dailyNew||0)-S.today.newN);}

/* ================= 词条 ================= */
function normWord(x){
  let w='';
  if(typeof x==='string')w=x;
  else if(x&&typeof x==='object'&&x.w)w=String(x.w);
  w=String(w).toLowerCase().trim().split(/\s+/)[0]||'';
  return w.replace(/[^a-z\-']/g,'').replace(/^[-']+|[-']+$/g,'');
}
function entry(w){
  if(!w)return null;
  const k=String(w).toLowerCase().trim();
  if(S.words[k]&&S.words[k].def)return S.words[k];
  for(let i=0;i<BANK.length;i++)if(BANK[i].w===k)return BANK[i];
  return S.words[k]||null;
}
function hasDef(w){const e=entry(w);return !!(e&&e.def&&e.def.length>6);}
function allEntries(){
  const m={};BANK.forEach(e=>m[e.w]=e);
  Object.keys(S.words).forEach(k=>{const e=S.words[k];if(e&&e.def)m[k]=e;});
  return Object.keys(m).map(k=>m[k]);
}
function learned(w){return !!(S.mem[w]&&S.mem[w].seen>0);}
function normEntry(x){
  if(!x||!x.w||!x.def)return null;
  const w=normWord(x.w);
  if(!w||w.length<2)return null;
  const arr=v=>Array.isArray(v)?v.map(z=>String(z).trim()).filter(Boolean).slice(0,6):[];
  return {w:w,pos:String(x.pos||''),ipa:String(x.ipa||''),
    lvl:clamp(parseInt(x.lvl,10)||S.profile.level||3,1,6),
    def:String(x.def).replace(/\s+/g,' ').trim(),
    ex:String(x.ex||''),syn:arr(x.syn),ant:arr(x.ant),forms:arr(x.forms),
    col:arr(x.col),note:String(x.note||''),zh:String(x.zh||''),src:'ai'};
}

/* ================= 遗忘曲线 ================= */
function grade(w,ok,opts){
  opts=opts||{};
  let m=S.mem[w];
  if(!m)m=S.mem[w]={seen:0,right:0,wrong:0,box:0,ease:2.5,iv:0,due:0,last:0,hist:[]};
  if(!opts.self)m.seen=(m.seen||0)+1;
  m.last=Date.now();
  if(ok){
    m.right=(m.right||0)+1;
    m.ease=Math.min(3.2,(m.ease||2.5)+0.06);
    m.box=opts.self?clamp(Math.max(m.box,1)+1,1,BOX.length-1):clamp((m.box||0)+1,0,BOX.length-1);
    m.iv=BOX[m.box];
  }else{
    m.wrong=(m.wrong||0)+1;m.ease=Math.max(1.3,(m.ease||2.5)-0.22);
    m.box=opts.self?1:Math.max(0,(m.box||0)-2);
    m.iv=0.014;
  }
  m.due=Date.now()+m.iv*DAY;
  m.hist=m.hist||[];m.hist.push({t:Date.now(),ok:ok?1:0});
  if(m.hist.length>40)m.hist.shift();
  save();return m;
}
function retention(m){
  if(!m||!m.seen||!m.iv)return 0;
  const stab=Math.max(0.4,m.iv*1.2);
  const el=Math.max(0,(Date.now()-(m.last||Date.now()))/DAY);
  return Math.exp(-el/stab);
}
function health(){
  const ws=Object.keys(S.mem).filter(w=>S.mem[w].seen>0);
  if(!ws.length)return 0;
  return Math.round(ws.reduce((a,w)=>a+retention(S.mem[w]),0)/ws.length*100);
}
function dueList(){
  const out=[];
  Object.keys(S.mem).forEach(w=>{
    const m=S.mem[w];
    if(!m.seen||!m.due)return;
    if(m.due<=Date.now()&&hasDef(w))out.push(w);
  });
  out.sort((a,b)=>S.mem[a].due-S.mem[b].due);
  return out;
}
function dueText(m){
  if(!m||!m.due)return '未安排';
  const d=m.due-Date.now();
  if(d<=0){
    const o=-d;
    if(o<3600000)return '现在可复习';
    if(o<DAY)return '逾期 '+Math.round(o/3600000)+' 小时';
    return '逾期 '+Math.round(o/DAY)+' 天';
  }
  if(d<3600000)return '稍后';
  if(d<DAY)return Math.round(d/3600000)+' 小时后';
  return Math.round(d/DAY)+' 天后';
}
function accText(m){if(!m)return '—';const n=(m.right||0)+(m.wrong||0);return n?Math.round((m.right||0)/n*100)+'%':'—';}
function upcomingBars(){
  const base=new Date();base.setHours(0,0,0,0);
  const days=[];
  for(let i=0;i<7;i++){
    const s=base.getTime()+i*DAY,e=s+DAY;let n=0;
    Object.keys(S.mem).forEach(w=>{
      const m=S.mem[w];if(!m.seen||!m.due)return;
      if(i===0){if(m.due<e)n++;}else if(m.due>=s&&m.due<e)n++;
    });
    days.push({label:i===0?'今天':['日','一','二','三','四','五','六'][new Date(s).getDay()],n:n});
  }
  const max=Math.max.apply(null,days.map(d=>d.n).concat([1]));
  return '<div class="bars">'+days.map(d=>'<div class="bar"><i style="height:'+
    Math.max(4,Math.round(d.n/max*46))+'px"></i><span>'+d.label+'</span></div>').join('')+'</div>';
}

/* ================= 出题（去重 + 轮换） ================= */
function normTxt(s){
  return String(s||'').toLowerCase().replace(/[’']/g,'')
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function jaccard(a,b){
  const A=normTxt(a).split(' ').filter(Boolean),B=normTxt(b).split(' ').filter(Boolean);
  if(!A.length||!B.length)return 1;
  const sa={};A.forEach(x=>{sa[x]=1;});
  let inter=0;const sb={};
  B.forEach(x=>{sb[x]=1;if(sa[x])inter++;});
  const uni=Object.keys(sa).length+Object.keys(sb).length-inter;
  return uni?inter/uni:1;
}
function decayUse(){
  const u=S.optUse||{};
  Object.keys(u).forEach(k=>{
    u[k]=Math.floor((u[k]||0)*0.6);
    if(u[k]<=0)delete u[k];
  });
  S.optUse=u;
}
function makeQ(word,use){
  const e=entry(word);
  if(!e||!e.def)return null;
  use=use||S.optUse||{};
  const target=normTxt(e.def);
  const seenTxt={};seenTxt[target]=1;
  const pool=[];
  allEntries().forEach(x=>{
    if(!x||!x.w||!x.def||x.w===e.w)return;
    const t=normTxt(x.def);
    if(!t||seenTxt[t])return;
    if((e.syn||[]).indexOf(x.w)>=0||(x.syn||[]).indexOf(e.w)>=0)return;
    seenTxt[t]=1;
    const samePos=(x.pos&&x.pos===e.pos)?0:1;
    const lv=Math.abs((x.lvl||3)-(e.lvl||3));
    const pen=samePos*2+(lv<=1?0:(lv<=2?1:2));
    pool.push({d:x.def,t:t,u:use[t]||0,pen:pen,r:Math.random()});
  });
  /* 先按 历史使用次数 → 相似度惩罚 → 随机 排序，未出现过的干扰项优先 */
  pool.sort((a,b)=>(a.u-b.u)||(a.pen-b.pen)||(a.r-b.r));
  const chosen=[];
  for(let i=0;i<pool.length&&chosen.length<3;i++){
    const c=pool[i];
    let bad=false;
    for(let j=0;j<chosen.length;j++){
      if(jaccard(c.d,chosen[j].d)>0.45){bad=true;break;}
      if(c.t.indexOf(chosen[j].t)>=0||chosen[j].t.indexOf(c.t)>=0){bad=true;break;}
    }
    if(bad)continue;
    chosen.push(c);
  }
  if(chosen.length<3)return null;
  chosen.forEach(c=>{use[c.t]=(use[c.t]||0)+1;});
  S.optUse=use;
  const correct=rnd(4);
  const options=chosen.map(c=>c.d);
  options.splice(correct,0,e.def);
  return {w:e.w,lvl:e.lvl||3,options:options,correct:correct,picked:null,ok:false};
}
function optList(q,act){
  let h='';
  q.options.forEach(function(op,i){
    let cls='';
    if(q.picked!=null)cls=(i===q.correct)?'ok':((i===q.picked)?'bad':'dim');
    h+='<button class="opt '+cls+'" data-act="'+act+'" data-val="'+i+'">'
      +'<span class="ltr">'+'ABCD'[i]+'</span><span>'+esc(op)+'</span></button>';
  });
  let icls='idk';
  if(q.picked!=null)icls+=(q.picked===4?' bad':' dim');
  h+='<button class="opt '+icls+'" data-act="'+act+'" data-val="4">'
    +'<span class="ltr">?</span><span>I don’t know（不认识这个词）</span></button>';
  return h;
}

/* ================= 会话 ================= */
function newSpellState(){return {input:'',attempt:0,result:null,revealed:false,hint:false,counted:false};}
function startSession(kind,list){
  const seen={},arr=[];
  list.forEach(w=>{if(w&&!seen[w]){seen[w]=1;arr.push(w);}});
  if(!arr.length){toast('没有可学的词');go('home');return;}
  decayUse();
  S.session={kind:kind,list:arr.slice(),words0:arr.slice(),idx:0,round:1,phase:'quiz',
    q:null,detailW:null,done:0,right:0,requeued:{},
    spellState:null,spellRight:0,spellTotal:0,started:Date.now()};
  save();loadQuestion();
}
function loadQuestion(){
  const ses=S.session;
  if(!ses){go('home');return;}
  while(ses.idx<ses.list.length){
    const w=ses.list[ses.idx];
    if(!hasDef(w)){ses.idx++;continue;}
    const q=makeQ(w);
    if(!q){ses.idx++;continue;}
    ses.q=q;ses.phase='quiz';ses.detailW=null;save();go('quiz');return;
  }
  if(ses.kind==='review'&&ses.round===1){startRound2();return;}
  finishSession();
}
function nextWord(){
  const ses=S.session;
  if(!ses){go('home');return;}
  ses.idx++;ses.q=null;ses.phase='quiz';ses.detailW=null;save();loadQuestion();
}
function startRound2(){
  const ses=S.session;
  if(!ses){go('home');return;}
  const list=ses.words0.filter(w=>hasDef(w));
  if(!list.length){finishSession();return;}
  ses.round=2;ses.phase='spell';ses.idx=0;ses.list=list;
  ses.spellState=newSpellState();ses.q=null;ses.detailW=null;
  save();go('spell');
}
function finishSession(){
  const ses=S.session;
  if(!ses){go('home');return;}
  if(ses.done>0)touchStreak();
  UI.summary={done:ses.done,right:ses.right,kind:ses.kind,
    total:(ses.words0||ses.list||[]).length,
    spellRight:ses.spellRight||0,spellTotal:ses.spellTotal||0};
  S.session=null;save();go('done');
}
function resumeSession(){
  const ses=S.session;
  if(!ses){go('home');return;}
  if(ses.phase==='spell'){go('spell');return;}
  if(ses.phase==='detail'&&ses.detailW&&hasDef(ses.detailW)){
    UI.e=entry(ses.detailW);UI.showZh=false;UI.ai='';UI.err='';UI.busy=false;go('detail');return;
  }
  if(ses.q){go('quiz');return;}
  loadQuestion();
}
function pick(i){
  const ses=S.session;
  if(!ses||!ses.q||ses.q.picked!=null)return;
  const q=ses.q;
  const idk=(i===4);
  q.picked=idk?4:i;
  q.ok=(!idk&&i===q.correct);
  const wasNew=!learned(q.w);
  if(q.ok)ses.right++;
  ses.done++;
  ensureDay();
  if(wasNew)S.today.newN++;else S.today.revN++;
  S.today[q.ok?'right':'wrong']++;
  S.stats[q.ok?'right':'wrong']++;
  grade(q.w,q.ok);
  if(!q.ok&&!ses.requeued[q.w]){ses.requeued[q.w]=1;ses.list.push(q.w);}
  save();render();
  if(q.ok){
    const fast=(ses.kind==='review');
    setTimeout(function(){
      if(S.session!==ses||UI.screen!=='quiz'||ses.q!==q||!q.ok)return;
      if(fast)nextWord();else openDetail(q.w);
    },700);
  }
}
function openDetail(w){
  const e=entry(w);
  if(!e){toast('找不到这个单词的词条');return;}
  UI.from=(UI.screen==='stats')?'stats':(S.session?'quiz':'home');
  UI.e=e;UI.showZh=false;UI.ai='';UI.err='';UI.busy=false;
  if(S.session){S.session.phase='detail';S.session.detailW=w;save();}
  go('detail');
}
function detailGrade(ok){
  const e=UI.e;if(!e)return;
  grade(e.w,ok,{self:true});
  if(ok)touchStreak();
  if(S.session&&S.session.phase==='detail'){
    S.session.phase='quiz';S.session.detailW=null;save();nextWord();
  }else{
    if(S.session){S.session.phase='quiz';S.session.detailW=null;save();}
    go(UI.from==='stats'?'stats':'home');
  }
}
function detailBack(){
  if(S.session&&S.session.phase==='detail'){
    S.session.phase='quiz';S.session.detailW=null;save();go('quiz');
  }else{
    go(UI.from==='stats'?'stats':'home');
  }
}
function spellSubmit(){
  const ses=S.session;
  if(!ses||ses.phase!=='spell')return;
  const w=ses.list[ses.idx];
  const st=ses.spellState||(ses.spellState=newSpellState());
  if(st.revealed)return;
  const val=String(st.input||'').trim().toLowerCase().replace(/[^a-z\-']/g,'');
  if(!val){toast('先输入拼写');return;}
  if(val===w){
    st.result='right';st.revealed=true;
    if(!st.counted){st.counted=true;ses.spellTotal++;ses.spellRight++;S.stats.spellRight++;}
    save();render();
    setTimeout(function(){
      if(S.session===ses&&UI.screen==='spell'&&ses.spellState&&ses.spellState.result==='right')spellAdvance();
    },760);
  }else{
    st.attempt=(st.attempt||0)+1;st.result='wrong';
    if(st.attempt>=2){
      st.revealed=true;
      if(!st.counted){st.counted=true;ses.spellTotal++;S.stats.spellWrong++;grade(w,false);}
    }
    save();render();
  }
}
function spellReveal(){
  const ses=S.session;
  if(!ses||ses.phase!=='spell')return;
  const w=ses.list[ses.idx],st=ses.spellState;
  if(!st||st.revealed)return;
  st.revealed=true;st.result='wrong';
  if(!st.counted){st.counted=true;ses.spellTotal++;S.stats.spellWrong++;grade(w,false);}
  save();render();
}
function spellHint(){
  const ses=S.session;
  if(!ses||ses.phase!=='spell')return;
  if(!ses.spellState)ses.spellState=newSpellState();
  ses.spellState.hint=true;save();render();
}
function spellAdvance(){
  const ses=S.session;
  if(!ses)return;
  ses.idx++;
  if(ses.idx>=ses.list.length){finishSession();return;}
  ses.spellState=newSpellState();save();go('spell');
}

/* ================= DeepSeek ================= */
function aiReady(){return !!(S.settings.key||'').trim();}
async function aiChat(o){
  const st=S.settings;
  const key=(st.key||'').trim();
  if(!key)throw new Error('请先填写 DeepSeek API Key');
  const base=(st.proxy||st.base||'https://api.deepseek.com').replace(/\/+$/,'');
  const url=/\/chat\/completions$/.test(base)?base:base+'/chat/completions';
  const maxTokens=o.maxTokens||2000;
  const body={model:(st.model||'deepseek-chat').trim(),messages:o.messages,stream:false,
    temperature:(o.temp==null?0.5:o.temp),max_tokens:maxTokens};
  if(o.json)body.response_format={type:'json_object'};
  const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  const timer=setTimeout(function(){if(ctrl)ctrl.abort();},90000);
  let res;
  try{
    res=await fetch(url,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined});
  }catch(e){
    clearTimeout(timer);
    if(e&&e.name==='AbortError')throw new Error('请求超时，请重试或检查代理');
    throw new Error('网络失败：多半是跨域 CORS，请在设置填代理地址');
  }
  clearTimeout(timer);
  const raw=await res.text();
  if(!res.ok)throw new Error('HTTP '+res.status+'：'+raw.slice(0,180));
  let d;
  try{d=JSON.parse(raw);}catch(e){throw new Error('返回不是 JSON：'+raw.slice(0,120));}
  if(d.error)throw new Error(d.error.message||'接口报错');
  const ch=d.choices&&d.choices[0];
  if(!ch)throw new Error('返回结构异常：'+raw.slice(0,120));
  const msg=ch.message||{};
  const content=stripThink(msg.content||'');
  if(!content){
    if(ch.finish_reason==='length'&&maxTokens<6000)return aiChat(Object.assign({},o,{maxTokens:6000}));
    const onlyThink=!!msg.reasoning_content;
    throw new Error((onlyThink?'模型只输出了思考过程':'AI 返回为空')
      +'（finish_reason='+(ch.finish_reason||'unknown')+'）');
  }
  return content;
}
function parseJSON(t){
  let s=String(t||'').trim().replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
  const tryObj=function(str){
    try{const v=JSON.parse(str);if(v&&typeof v==='object')return v;}catch(e){}
    return null;
  };
  let r=tryObj(s);if(r)return r;
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>=0&&b>a){r=tryObj(s.slice(a,b+1));if(r)return r;}
  const c=s.indexOf('['),d=s.lastIndexOf(']');
  if(c>=0&&d>c){r=tryObj(s.slice(c,d+1));if(r)return r;}
  throw new Error('返回内容不是 JSON');
}
async function aiJSON(prompt,maxTokens,temp){
  let last=null;
  for(let i=0;i<2;i++){
    try{
      const txt=await aiChat({
        messages:[
          {role:'system',content:'你是英语词汇专家。只输出一个合法 JSON 对象，不要 Markdown 代码块，不要解释，不要输出思考过程。'},
          {role:'user',content:prompt}],
        json:true,maxTokens:maxTokens,temp:(temp==null?0.6:temp)});
      try{return parseJSON(txt);}
      catch(e){last=new Error('返回内容不是合法 JSON（开头：'+txt.slice(0,90).replace(/\s+/g,' ')+'…）');}
    }catch(e){last=e;}
  }
  throw last||new Error('AI 调用失败');
}
async function ensureEntries(words){
  const need=words.filter(w=>w&&!hasDef(w));
  if(!need.length)return [];
  if(!aiReady())return need;
  const still=[];
  for(let i=0;i<need.length;i+=6){
    const chunk=need.slice(i,i+6);
    try{
      const obj=await aiJSON('请为下面 '+chunk.length+' 个英语单词生成词条：'+chunk.join(', ')
        +'。只输出 JSON：{"words":[{"w":"","pos":"","ipa":"/音标/","def":"纯英文释义（对齐牛津/柯林斯）",'
        +'"ex":"英文例句","syn":["近义词"],"ant":["反义词"],"forms":["词形变化"],'
        +'"col":["常见搭配"],"note":"中文用法提示","zh":"中文释义"}]}。'
        +'要求：w 必须是给定单词之一且小写；def 不得含中文。',2600,0.4);
      (obj.words||[]).forEach(function(x){
        const e=normEntry(x);
        if(e&&chunk.indexOf(e.w)>=0)S.words[e.w]=e;
      });
      save();
    }catch(e){chunk.forEach(w=>{if(still.indexOf(w)<0)still.push(w);});}
  }
  need.forEach(w=>{if(!hasDef(w)&&still.indexOf(w)<0)still.push(w);});
  return still;
}

  for(let b=0;b<batches&&got.length<target;b++){

      +'感兴趣的主题/场景：'+topics+'\n'
      +'难度：整体贴近 '+LEVELS[(p.level||3)-1]+'，可有 1–2 个略高；避免过于基础的词。\n'
      +(got.length?('不要与这些已选词重复：'+got.join(', ')+'。\n'):'')
      +'释义要求：与《牛津高阶》《柯林斯》《剑桥》等权威词典的释义保持一致，用一句简洁的纯英文；'
      +'音标用英式；搭配与例句要地道。\n'
      +'只输出 JSON 对象：{"words":[{"w":"单词","pos":"词性","ipa":"/音标/","def":"英文释义",'
      +'"ex":"英文例句","syn":["近义词1","近义词2"],"ant":["反义词"],"forms":["词形变化1","词形变化2"],'
      +'"col":["常见搭配1","常见搭配2"],"note":"中文用法提示","zh":"中文释义"}]}\n'
      +'不要输出 JSON 以外的任何内容。';
    try{
      const obj=await aiJSON(prompt,3000,0.8);
      const list=Array.isArray(obj.words)?obj.words:[];
      list.forEach(function(x){
        const e=normEntry(x);
        if(!e||seen[e.w])return;
        seen[e.w]=1;S.words[e.w]=e;got.push(e.w);
      });
      save();
    }catch(err){
      fails++;UI.packProg.err=err.message;
      if(fails>=3)break;
    }
  }
  UI.packProg.got=got.length;
  if(got.length<8){
    UI.busy=false;UI.packErr=UI.packProg.err||'AI 没有返回足够的单词，请重试';
    go('key');toast('生成失败：'+UI.packErr,3600);return;
  }
  S.pack={createdAt:Date.now(),level:p.level||3,goal:p.goal||'',topics:(p.topics||[]).slice(),words:got};
  p.needsDone=true;save();
  UI.busy=false;go('home');
  toast('词包已生成：'+got.length+' 个词',3000);
}

const DICTS=[
 ['有道','https://dict.youdao.com/result?word={w}&lang=en'],
 ['牛津学习者','https://www.oxfordlearnersdictionaries.com/definition/english/{w}'],
 ['剑桥','https://dictionary.cambridge.org/dictionary/english/{w}'],
 ['柯林斯','https://www.collinsdictionary.com/dictionary/english/{w}'],
 ['韦氏','https://www.merriam-webster.com/dictionary/{w}'],
 ['Vocabulary','https://www.vocabulary.com/dictionary/{w}']
];
async function syncDict(){
  const e=UI.e;if(!e)return;
  UI.busy=true;UI.err='';render();
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(e.w));
    if(!r.ok)throw new Error('词典接口返回 '+r.status);
    const j=await r.json();
    const arr=Array.isArray(j)?j:[];
    if(!arr.length)throw new Error('词典里没有找到这个词');
    const senses=[],syn=[];let ipa='';
    arr.forEach(function(ent){
      if(!ipa&&ent.phonetic)ipa=ent.phonetic;
      (ent.phonetics||[]).forEach(function(p){if(!ipa&&p.text)ipa=p.text;});
      (ent.meanings||[]).forEach(function(m){
        (m.definitions||[]).slice(0,2).forEach(function(d){
          if(d.definition&&senses.length<6)
            senses.push({pos:m.partOfSpeech||'',def:d.definition,ex:d.example||''});
        });
        (m.synonyms||[]).forEach(function(s){
          if(syn.length<8&&syn.indexOf(s)<0&&s.indexOf(' ')<0)syn.push(s);
        });
      });
    });
    const base=S.words[e.w]||Object.assign({},e);
    base.dict={ipa:ipa||'',senses:senses,syn:syn,at:Date.now()};
    if(!base.ipa&&ipa)base.ipa=ipa;
    S.words[e.w]=base;save();
    UI.e=base;UI.busy=false;render();
    toast('已同步 '+senses.length+' 条词典释义');
  }catch(err){
    UI.busy=false;UI.err='词典同步失败：'+err.message+'（可点下方链接直接查）';render();
  }
}

function curveSVG(m){
  const stab=Math.max(0.5,(m.iv||1)*1.2);
  const W=300,H=90;let path='';
  for(let i=0;i<=30;i++){
    const r=Math.exp(-i/stab);
    const x=i/30*W,y=H-6-r*(H-16);
    path+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }
  const area=path+' L '+W+' '+H+' L 0 '+H+' Z';
  const dueX=clamp((m.iv||0)/30*W,1,W-1);
  return '<svg viewBox="0 0 300 90" style="width:100%;height:auto;display:block;margin-top:6px">'
    +'<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="#5b8cff" stop-opacity=".42"/>'
    +'<stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#cg)"/>'
    +'<path d="'+path+'" fill="none" stroke="#7aa2ff" stroke-width="2"/>'
    +'<line x1="'+dueX.toFixed(1)+'" y1="0" x2="'+dueX.toFixed(1)+'" y2="'+H
    +'" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3"/>'
    +'<text x="2" y="'+(H-1)+'" fill="#8fa2c4" font-size="9">0d</text>'
    +'<text x="'+(W-20)+'" y="'+(H-1)+'" fill="#8fa2c4" font-size="9">30d</text></svg>';
}

/* ================= 测评 ================= */
function startTest(){
  decayUse();
  const plan=[1,1,2,2,3,4,4,5];
  const used={},qs=[];
  plan.forEach(function(lv){
    const pool=shuffle(BANK.filter(function(e){return e.lvl===lv&&!used[e.w];}));
    for(let i=0;i<pool.length;i++){
      const q=makeQ(pool[i].w);
      if(q&&!used[pool[i].w]){used[pool[i].w]=1;qs.push(q);break;}
    }
  });
  const rest=shuffle(BANK.filter(function(e){return !used[e.w];}));
  while(qs.length<8&&rest.length){
    const x=rest.pop();
    const q=makeQ(x.w);
    if(q){used[x.w]=1;qs.push(q);}
  }
  if(qs.length<4){toast('题库不足，无法生成测评');return;}
  S.test={qs:qs,i:0,right:0,score:0,max:qs.reduce(function(a,q){return a+(q.lvl||3);},0)};
  save();go('test');
}
function testPick(i){
  const T=S.test;if(!T)return;
  const q=T.qs[T.i];if(!q||q.picked!=null)return;
  const idk=(i===4);
  q.picked=idk?4:i;
  q.ok=(!idk&&i===q.correct);
  if(q.ok){T.right++;T.score+=(q.lvl||3);}
  save();render();
  setTimeout(function(){
    if(!S.test||UI.screen!=='test')return;
    T.i++;
    if(T.i>=T.qs.length)finishTest();
    else render();
  },q.ok?520:900);
}
function finishTest(){
  const T=S.test;
  const ratio=T&&T.max?T.score/T.max:0;
  const lv=clamp(Math.round(ratio*5)+1,1,6);
  S.profile.level=lv;S.profile.tested=true;
  if(!S.profile.dailyNew)S.profile.dailyNew=10;
  S.test=null;save();go('needs');
}

    if(!S.profile.dailyNew)S.profile.dailyNew=10;save();go('needs');},
  tokeys:function(){UI.packErr='';go('key');},
  skipkey:function(){S.profile.needsDone=true;save();go('home');
    toast('已跳过：当前使用内置词库',2600);},
  topic:function(v){
    const p=S.profile;
    if(!Array.isArray(p.topics))p.topics=[];

document.addEventListener('click',function(ev){
  const t=ev.target;
  const el=t&&t.closest?t.closest('[data-act]'):null;
  if(!el)return;
  const act=el.getAttribute('data-act');
  const val=el.getAttribute('data-val')||'';
  if(!A[act])return;
  ev.preventDefault();
  try{A[act](val,el);}catch(e){toast('出错了：'+e.message,3200);}
});
document.addEventListener('change',function(ev){
  const t=ev.target;
  const el=t&&t.closest?t.closest('[data-set]'):null;
  if(!el)return;
  const path=el.getAttribute('data-set').split('.');
  let v=el.value;
  if(path[0]==='settings')S.settings[path[1]]=String(v).trim();
  else if(path[0]==='profile'){
    if(path[1]==='level')v=clamp(parseInt(v,10)||3,1,6);
    else if(path[1]==='dailyNew')v=clamp(parseInt(v,10)||10,3,40);
    else if(path[1]==='days')v=clamp(parseInt(v,10)||7,3,60);
    else v=String(v).trim();
    S.profile[path[1]]=v;
  }
  save();
  if(path[1]==='level'||path[1]==='dailyNew')render();
  toast('已保存');
});
let spellSaveT;
document.addEventListener('input',function(ev){
  const el=ev.target;
  if(!el||!el.getAttribute||el.getAttribute('data-input')!=='spell')return;
  const ses=S.session;
  if(!ses||ses.phase!=='spell')return;
  if(!ses.spellState)ses.spellState=newSpellState();
  ses.spellState.input=el.value;
  clearTimeout(spellSaveT);spellSaveT=setTimeout(function(){save();},400);
  const box=$('#lboxes');
  if(box){
    const w=ses.list[ses.idx]||'';
    const clean=w.replace(/[^a-z]/gi,'');
    const typed=String(el.value).toLowerCase().replace(/[^a-z]/g,'');
    let html='';
    for(let i=0;i<clean.length;i++){
      const ch=typed[i]||'';
      html+='<span class="lbox'+(ch?' fill':'')+'">'+(ch?esc(ch):'')+'</span>';
    }
    box.innerHTML=html;
  }
});
document.addEventListener('keydown',function(ev){
  const el=ev.target;
  if(ev.key!=='Enter')return;
  if(!el||!el.getAttribute||el.getAttribute('data-input')!=='spell')return;
  ev.preventDefault();spellSubmit();
});

/* ================= 备份 ================= */
async function exportData(){
  const txt=JSON.stringify(S);
  try{
    await navigator.clipboard.writeText(txt);
    toast('备份 JSON 已复制到剪贴板',3200);
  }catch(e){window.prompt('长按全选复制：',txt);}
}
function importData(){
  const txt=window.prompt('粘贴之前复制的备份 JSON：');
  if(!txt)return;
  try{
    const o=JSON.parse(txt);
    if(!o||typeof o!=='object')throw new Error('格式不对');
    localStorage.setItem(KEY,JSON.stringify(o));
    toast('导入成功，正在刷新…');
    setTimeout(function(){location.reload();},600);
  }catch(e){toast('导入失败：'+e.message,3200);}
}
function resetAll(){
  if(!window.confirm('确定清空全部学习数据和设置？不可撤销。'))return;
  try{
    localStorage.removeItem(KEY);
    localStorage.removeItem('lexis.v3');
    localStorage.removeItem('lexis.v2');
  }catch(e){}
  S=defaults();UI.e=null;UI.summary=null;UI.dbg='';UI.packErr='';
  UI.screen='welcome';render();toast('已清空');
}

/* ================= 启动 ================= */
(function boot(){
  try{
    ensureDay();
    if(S.session){
      if(S.session.phase==='spell')UI.screen='spell';
      else if(S.session.phase==='detail'&&S.session.detailW&&hasDef(S.session.detailW)){
        UI.e=entry(S.session.detailW);UI.showZh=false;UI.ai='';UI.err='';UI.busy=false;
        UI.screen='detail';
      }else UI.screen='quiz';
      render();return;
    }
    if(S.test&&S.test.qs&&S.test.qs.length){UI.screen='test';render();return;}
    if(!S.profile.tested){UI.screen='welcome';render();return;}
    if(!S.profile.needsDone){UI.screen='needs';render();return;}
    UI.screen='home';render();
  }catch(e){
    document.body.innerHTML='<pre style="padding:20px;color:#fff;white-space:pre-wrap">启动失败：'+e.message+'</pre>';
  }
})();
